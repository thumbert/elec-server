<!DOCTYPE html>
<html>

<head>
    <title>Basket option</title>
    <meta name="viewport" content="width=device-width" />
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="assets/documentation.css" />

    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js" charset="utf-8"></script>
</head>

<body>
    <h1 style="padding-left: 24px;">Basket option</h1>
    <div class="app-layout">
        <nav class="menu">
            <a href="#" class="active" onclick="showContent(event, 'Hedging')">Quebec</a>
        </nav>
        <main class="content">
            <div id="Hedging" class="content-section active">
                <h3>Hedging</h3>
                <form id="start-prices" class="row g-3 mb-3" style="max-width: 800px;" onsubmit="return false;">
                    <div class="col-md-4">
                        <label for="input-power" class="form-label">Power start price</label>
                        <div class="input-group">
                            <input type="number" class="form-control" id="input-power" value="41.0" step="0.5" min="0">
                            <span class="input-group-text">$/MWh</span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="input-gas" class="form-label">Gas start price</label>
                        <div class="input-group">
                            <input type="number" class="form-control" id="input-gas" value="3.5" step="0.1" min="0">
                            <span class="input-group-text">$/MMBtu</span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="input-rggi" class="form-label">RGGI start price</label>
                        <div class="input-group">
                            <input type="number" class="form-control" id="input-rggi" value="2.4" step="0.1" min="0">
                            <span class="input-group-text">$/MMBtu</span>
                        </div>
                    </div>
                </form>
                <div id="actual-prices"></div>
                <div id="hedge-performance"></div>
                <div id="summary-table"></div>

                <div id="hedging"></div>
                <div id="payoff"></div>
            </div>
        </main>
    </div>
    <script>
        function showContent(evt, id) {
            evt.preventDefault();
            document.querySelectorAll('.menu a').forEach(a => a.classList.remove('active'));
            evt.target.classList.add('active');
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
    </div>


    <div style="height:24px"></div>
    <div style="font-size: 12px;"><i>Report produced with /docs/basket_option/web/main.dart</i></div>

    <script defer src="main.dart.js"></script>
</body>

</html>
