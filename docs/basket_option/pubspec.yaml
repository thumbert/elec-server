name: basket_option
description: Interactive basket option hedging report.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  build_html:
    git: https://github.com/thumbert/build_html.git
  dama:
    git: https://github.com/thumbert/dama.git
  date:
    git: https://github.com/thumbert/date.git
  elec:
    git: https://github.com/thumbert/elec.git
  more: ^4.7.0
  plotly_dart:
    git: https://github.com/thumbert/plotly_dart.git
  table:
    git: https://github.com/thumbert/table.git
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.9.0
  build_web_compilers: ^4.4.0
  lints: '>=6.1.0 <7.0.0'
  test: ^1.21.0
